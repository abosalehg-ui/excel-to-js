name: Tests

on:
  push:
  pull_request:

# المهمة تقرأ الكود فقط — لا نرث صلاحيات الكتابة الافتراضية للريبو
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # مثبّتة على SHA: وسم v4 قابل لإعادة التوجيه فيغيّر ما يُنفَّذ في الـCI
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
      - name: Install dev dependencies (jsdom for UI tests, prettier)
        run: npm ci
      - name: Check formatting
        run: npx prettier --check "**/*.{js,json,yml,md}"
      - name: Run test suite (UTC)
        run: node tests/run-node.js
      - name: Run test suite (DST timezone)
        run: node tests/run-node.js
        env:
          TZ: America/New_York
      # عتبات التغطية في .c8rc.json — الفجوات كانت تُكشف بالقراءة اليدوية
      # وحدها، وثلاثة أخطاء صامتة عاشت في فروع غير مغطّاة حتى مراجعة مِحَك
      - name: Check coverage thresholds
        run: npm run coverage
