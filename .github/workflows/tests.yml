name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run test suite (UTC)
        run: node tests/run-node.js
      - name: Run test suite (DST timezone)
        run: node tests/run-node.js
        env:
          TZ: America/New_York
